# ============================================================
# 语文教学 RAG 系统配置
# 标签体系、切片规则、模型与检索参数都集中在这里，可增删改。
# ============================================================

tagging:
  # 学段（枚举）
  grades:
    - 七年级上
    - 七年级下
    - 八年级上
    - 八年级下
    - 九年级上
    - 九年级下
    - 高一上
    - 高一下
    - 高二上
    - 高二下
    - 高三上
    - 高三下

  # 知识点（枚举）
  knowledge_points:
    - 文言实词
    - 文言虚词
    - 特殊句式
    - 现代文赏析
    - 作文立意
    - 文学常识
    - 古诗文默写
    - 语言运用
    - 阅读理解
    - 写作技法

  # 文档类型（枚举，决定切片策略）
  doc_types:
    - 教案
    - 课堂笔记
    - 学生错题
    - 习题
    - 学生作答样本
    - 文言笔记
    - 文言原著
    - 作文材料
    - 其他

  # 学情标签（枚举，可多选，分类时也可生成自由文本学情描述）
  learning_tags:
    - 班级共性错误
    - 易混淆点
    - 学生易踩坑

  # 权威等级（检索排序权重：数字越大越优先）
  # 冲突时以教师手写批注为准 → 教师批注权威最高
  authority:
    - { name: 教师批注, weight: 5 }
    - { name: 教材, weight: 4 }
    - { name: 教师教案, weight: 4 }
    - { name: 教参, weight: 3 }
    - { name: 优质课案例, weight: 3 }
    - { name: 学生作答, weight: 2 }
    - { name: 其他, weight: 1 }

llm:
  base_url: https://api.deepseek.com
  chat_model: deepseek-v4-flash        # 快：分类 / 切片边界 / 答疑 / 出题结构化输出
  reason_model: deepseek-v4-pro  # 慢但推理强：写教案
  temperature: 0.2
  max_retries: 3

embedding:
  model_name: models/bge-base-zh-v1.5   # 相对路径（相对项目根目录），整包拷贝后仍能加载
  # device: auto -
  device: auto
  query_instruction: "为这个句子生成表示以用于检索相关文章："

retrieval:
  rewrite: false  # 检索前是否用 LLM 做查询扩展/意图解析/精排（true=更准但每轮多 4~6 次 LLM 往返；false=纯向量+BM25+RRF，快很多）
  private_top_k: 6    # 私有库召回条数（优先）
  public_top_k: 4     # 公共库补充条数
  bm25_top_k: 8       # 关键词召回条数（每个库）
  rrf_k: 60           # RRF 融合参数
  private_weight: 1.2 # 私有库在最终排序中的加权（>1 表示私有优先）
  authority_boost: 0.15  # 权威相对加成系数：final = rrf * (1 + (权重-1)*系数)，1~5 档约放大 1.0~1.6 倍
  rerank: true            # 用 DeepSeek flash 对候选做相关性精排（无 key/失败时自动回退 RRF 排序）
  rerank_candidates: 20   # 送入精排的候选条数
  multiquery: 3           # 查询扩展的检索短语条数（含原查询）
  use_metadata_boost: true  # 检索时按 篇目/学段/知识点 元数据加权
  contextualize: true     # 嵌入/BM25 时把 篇目/学段/知识点 前置拼进文本（上下文检索）
  dedup_similarity: 0.8   # 近重复片段去重阈值（Jaccard 0~1，0 关闭）

generation:
  verify_grounding: false  # 写教案生成后做引用接地自检（额外一次 LLM 往返；false=跳过，更快）

chunking:
  max_chunk_chars: 450   # 兜底切片的块大小（对齐 bge-base-zh 512 token 上限，避免向量被截断/稀释）
  overlap_chars: 80      # 兜底切片重叠

ingestion:
  auto_save_generated: true   # 四大场景生成结果自动回库（沉淀进私有知识库）

paths:
  data_dir: data
  chroma_dir: data/chroma
  sqlite_db: data/ingest_state.db
  ingest_dir: ingest
  templates_dir: templates
  ppt_output_dir: data/ppt_output   # 生成的 PPT 输出目录（可填绝对路径，如 D:\我的PPT）
